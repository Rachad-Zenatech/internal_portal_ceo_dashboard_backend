version: "3.8"

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: zenatech-mqtt-broker
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./deployment/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck -u '' -P '' -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal_portal_net

volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  internal_portal_net:
    driver: bridge
