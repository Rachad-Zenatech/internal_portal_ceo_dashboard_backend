services:
  db:
    image: postgres:alpine
    container_name: ceo_db_local
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zenatech_ceo_dashboard
    ports:
      - "3001:5432"
    volumes:
      - ceo_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zenatech_ceo_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ceo_postgres_data:


