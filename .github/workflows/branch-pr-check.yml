name: Branch & PR Schema Verification

on:
  pull_request:
    branches:
      - main
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  verify-schema-and-scripts:
    name: Verify Database Schema Setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenatech_ceo_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Apply All Schemas on Clean DB
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenatech_ceo_dashboard
          DATABASE_SSL: false
        run: |
          echo "[*] Initializing database schemas on fresh test database..."
          python -m postgresql_db.setup_pbac_schema
          python -m postgresql_db.cross_service_schema
          python -m postgresql_db.notifications_schema
          echo "[*] Database schema verification complete!"