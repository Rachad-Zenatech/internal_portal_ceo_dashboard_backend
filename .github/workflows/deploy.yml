name: CI/CD Pipeline - CEO Dashboard Backend

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils \
            libpq-dev \
            gcc \
            curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Check Python Syntax
        run: |
          python -m py_compile server.py
          python -m compileall -q .

      - name: Run Ruff Lint
        run: |
          ruff check . --ignore E501 || true

      - name: Run Pytest
        run: |
          if [ -d "tests" ]; then
            pytest tests/ || true
          fi

  check-environment:
    name: Verify GitHub Environment & Secrets
    environment: Zenatech
    runs-on: ubuntu-latest
    steps:
      - name: Check if environment exists in GitHub
        env:
          TARGET_ENV: Zenatech
        run: |
          echo "Verifying environment '${TARGET_ENV}' in repository '${{ github.repository }}'..."
          HTTP_STATUS=$(curl -s -o /tmp/env_response.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN || github.token }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/environments/${TARGET_ENV}")

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "GitHub Environment '${TARGET_ENV}' verified."
          else
            echo "::warning::GitHub Environment '${TARGET_ENV}' returned status ${HTTP_STATUS}. Proceeding with repository-level and environment secrets."
          fi

      - name: Validate Required Environment Secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing_secrets=()

          check_secret() {
            local name="$1"
            local val="$2"
            if [ -z "$val" ]; then
              missing_secrets+=("$name")
            fi
          }

          check_secret "EC2_HOST" "$EC2_HOST"
          check_secret "EC2_SSH_KEY" "$EC2_SSH_KEY"
          check_secret "DATABASE_URL" "$DATABASE_URL"
          check_secret "SESSION_SECRET" "$SESSION_SECRET"
          check_secret "MICROSOFT_CLIENT_ID" "$MICROSOFT_CLIENT_ID"
          check_secret "MICROSOFT_CLIENT_SECRET" "$MICROSOFT_CLIENT_SECRET"
          check_secret "MICROSOFT_TENANT_ID" "$MICROSOFT_TENANT_ID"
          check_secret "FRONTEND_URL" "$FRONTEND_URL"
          check_secret "GEMINI_API_KEY" "$GEMINI_API_KEY"

          if [ ${#missing_secrets[@]} -ne 0 ]; then
            echo "::warning::The following secrets are unset: ${missing_secrets[*]}"
          else
            echo "All core environment secrets for 'Zenatech' are present."
          fi

  docker-build:
    name: Build Docker Image
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ceo-backend-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate-db:
    name: Migrate & Verify Database
    environment: Zenatech
    needs: [docker-build, check-environment]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: ${{ secrets.DATABASE_SSL || 'require' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install database check dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asyncpg python-dotenv

      - name: Check database reachability and verify schema
        id: db_check
        run: |
          python -c "
          import asyncio, os, sys
          import asyncpg

          async def main():
              db_url = os.environ.get('DATABASE_URL', '')
              if not db_url:
                  print('[WARN] DATABASE_URL secret is not configured.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('reachable=false\n')
                  return

              ssl_env = os.environ.get('DATABASE_SSL', 'require').lower()
              ssl_mode = 'require' if ssl_env in ('true', 'require', '1') else (None if ssl_env in ('disable', 'false', '0', 'none') else ssl_mode)
              try:
                  conn = await asyncio.wait_for(
                      asyncpg.connect(dsn=db_url, ssl=ssl_mode, statement_cache_size=0), timeout=8
                  )
                  val = await conn.fetchval('SELECT 1')
                  await conn.close()
                  print('[OK] Database (AWS RDS / PostgreSQL) is directly reachable from GitHub Actions runner.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('reachable=true\n')
              except Exception as exc:
                  print(f'[INFO] Database not directly reachable from GitHub runner ({exc!r}).')
                  print('[INFO] Target database is private within AWS VPC. Schema setup will execute on EC2 deployment host.')
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                      f.write('reachable=false\n')

          asyncio.run(main())
          "

      - name: Run Schema Bootstrap (if directly reachable)
        if: steps.db_check.outputs.reachable == 'true'
        run: |
          python -c "
          import asyncio, os
          import asyncpg
          from dotenv import load_dotenv
          load_dotenv()

          async def run_bootstrap():
              db_url = os.environ.get('DATABASE_URL', '')
              ssl_env = os.environ.get('DATABASE_SSL', 'require').lower()
              ssl_mode = 'require' if ssl_env in ('true', 'require', '1') else (None if ssl_env in ('disable', 'false', '0', 'none') else ssl_mode)
              conn = await asyncpg.connect(dsn=db_url, ssl=ssl_mode, statement_cache_size=0)
              try:
                  await conn.execute('''
                      CREATE TABLE IF NOT EXISTS ceo_events (
                          id BIGSERIAL PRIMARY KEY,
                          event_type VARCHAR(100) NOT NULL,
                          source VARCHAR(100) NOT NULL,
                          entity_id VARCHAR(100) NOT NULL,
                          data JSONB DEFAULT '{}'::jsonb,
                          created_at TIMESTAMPTZ DEFAULT NOW()
                      );
                      CREATE TABLE IF NOT EXISTS ceo_audit_logs (
                          id BIGSERIAL PRIMARY KEY,
                          action VARCHAR(100) NOT NULL,
                          source_application VARCHAR(100) NOT NULL,
                          target_application VARCHAR(100) NOT NULL,
                          target_entity VARCHAR(100) NOT NULL,
                          requested_by VARCHAR(255) NOT NULL,
                          result VARCHAR(50) NOT NULL,
                          details JSONB DEFAULT '{}'::jsonb,
                          created_at TIMESTAMPTZ DEFAULT NOW()
                      );
                      CREATE TABLE IF NOT EXISTS approver_role_assignments (
                          id UUID PRIMARY KEY,
                          user_id UUID NOT NULL,
                          user_email VARCHAR(255) NOT NULL,
                          user_name VARCHAR(255),
                          role_type VARCHAR(50) NOT NULL,
                          workflow_type VARCHAR(50) NOT NULL,
                          assigned_by VARCHAR(255) NOT NULL,
                          assigned_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          is_active BOOLEAN NOT NULL DEFAULT TRUE,
                          notes TEXT,
                          CONSTRAINT uq_user_active_role UNIQUE (user_id, role_type)
                      );
                      CREATE TABLE IF NOT EXISTS service_commands (
                          id BIGSERIAL PRIMARY KEY,
                          command_id UUID UNIQUE NOT NULL,
                          idempotency_key VARCHAR(255) UNIQUE,
                          target_service VARCHAR(64) NOT NULL,
                          resource_type VARCHAR(64) NOT NULL,
                          resource_id VARCHAR(128) NOT NULL,
                          command_type VARCHAR(64) NOT NULL,
                          payload JSONB NOT NULL DEFAULT '{}'::jsonb,
                          expected_source_version INT,
                          requested_by_user_id VARCHAR(128) NOT NULL,
                          requested_by_display_name VARCHAR(255),
                          status VARCHAR(32) NOT NULL DEFAULT 'QUEUED',
                          failure_code VARCHAR(64),
                          failure_message TEXT,
                          retryable BOOLEAN DEFAULT FALSE,
                          correlation_id VARCHAR(128),
                          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          dispatched_at TIMESTAMPTZ,
                          processing_at TIMESTAMPTZ,
                          completed_at TIMESTAMPTZ,
                          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                      );
                      CREATE TABLE IF NOT EXISTS service_outbox (
                          id BIGSERIAL PRIMARY KEY,
                          event_id UUID UNIQUE NOT NULL,
                          command_id UUID,
                          exchange_name VARCHAR(128) NOT NULL,
                          routing_key VARCHAR(128) NOT NULL,
                          payload JSONB NOT NULL,
                          status VARCHAR(32) NOT NULL DEFAULT 'PENDING',
                          retry_count INT NOT NULL DEFAULT 0,
                          last_error TEXT,
                          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          published_at TIMESTAMPTZ
                      );
                      CREATE TABLE IF NOT EXISTS service_inbox (
                          id BIGSERIAL PRIMARY KEY,
                          message_id VARCHAR(128) UNIQUE NOT NULL,
                          source_service VARCHAR(64) NOT NULL,
                          message_type VARCHAR(64) NOT NULL,
                          payload JSONB NOT NULL DEFAULT '{}'::jsonb,
                          processed_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                      );
                      CREATE TABLE IF NOT EXISTS ceo_service_projections (
                          id BIGSERIAL PRIMARY KEY,
                          service_name VARCHAR(64) NOT NULL,
                          resource_type VARCHAR(64) NOT NULL,
                          resource_id VARCHAR(128) NOT NULL,
                          version INT NOT NULL DEFAULT 1,
                          data JSONB NOT NULL DEFAULT '{}'::jsonb,
                          source_status VARCHAR(64),
                          last_synchronized_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          is_stale BOOLEAN NOT NULL DEFAULT FALSE,
                          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          CONSTRAINT uq_service_projections UNIQUE (service_name, resource_type, resource_id)
                      );
                      CREATE TABLE IF NOT EXISTS workflow_assignments (
                          id BIGSERIAL PRIMARY KEY,
                          workflow_id UUID UNIQUE NOT NULL,
                          workflow_type VARCHAR(64) NOT NULL,
                          assigned_approver_id UUID NOT NULL,
                          status VARCHAR(32) NOT NULL DEFAULT 'PENDING',
                          title VARCHAR(255) NOT NULL,
                          description TEXT,
                          payload JSONB NOT NULL DEFAULT '{}'::jsonb,
                          created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
                          updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
                      );
                  ''')
                  print('[OK] Schema verification and bootstrap succeeded.')
              finally:
                  await conn.close()

          asyncio.run(run_bootstrap())
          "

      - name: Verify database is healthy after verification (if directly reachable)
        if: steps.db_check.outputs.reachable == 'true'
        run: |
          python -c "
          import asyncio, os, sys
          import asyncpg

          async def main():
              ssl_env = os.environ.get('DATABASE_SSL', 'require').lower()
              ssl_mode = 'require' if ssl_env in ('true', 'require', '1') else (None if ssl_env in ('disable', 'false', '0', 'none') else ssl_env)
              try:
                  conn = await asyncio.wait_for(
                      asyncpg.connect(dsn=os.environ['DATABASE_URL'], ssl=ssl_mode, statement_cache_size=0), timeout=10
                  )
                  await conn.fetchval('SELECT 1')
                  await conn.close()
                  print('[OK] Database healthy.')
              except Exception as exc:
                  print(f'Post-check database verification failed, aborting deploy: {exc!r}', file=sys.stderr)
                  sys.exit(1)

          asyncio.run(main())
          "

  deploy-ec2:
    name: Deploy to EC2
    environment: Zenatech
    needs: [docker-build, check-environment, migrate-db]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY_ID || secrets.ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || secrets.SECRET_ACCESS_KEY }}
      AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID || vars.AWS_SECURITY_GROUP_ID }}

    steps:
      - name: Get GitHub runner IP
        id: ip
        run: echo "ipv4=$(curl -s https://api.ipify.org)" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        if: env.AWS_ACCESS_KEY != '' && env.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || vars.AWS_REGION || 'ca-central-1' }}

      - name: Authorize Security Group SSH
        if: env.AWS_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ env.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true

      - name: Deploy backend to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ec2-user' }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_SSL: ${{ secrets.DATABASE_SSL || 'require' }}
          ADMIN_DATABASE_URL: ${{ secrets.ADMIN_DATABASE_URL || secrets.ADMIN_PORTAL_DATABASE }}
          DB_MIN_CONNECTIONS: ${{ secrets.DB_MIN_CONNECTIONS || '2' }}
          DB_MAX_CONNECTIONS: ${{ secrets.DB_MAX_CONNECTIONS || '20' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_ACCOUNT_REVIEW_MODELS: ${{ secrets.GEMINI_ACCOUNT_REVIEW_MODELS }}
          GEMINI_AVAILABLE_MODELS: ${{ secrets.GEMINI_AVAILABLE_MODELS }}
          GEMINI_AVAILABLE_TOOL_QUOTA_MODELS: ${{ secrets.GEMINI_AVAILABLE_TOOL_QUOTA_MODELS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET || secrets.SESSION_SECRET }}
          JWT_ALGORITHM: ${{ secrets.JWT_ALGORITHM || 'HS256' }}
          JWT_ISSUER: ${{ secrets.JWT_ISSUER || 'zenatech-internal-portal' }}
          AUTH_TOKEN_TTL_SECONDS: ${{ secrets.AUTH_TOKEN_TTL_SECONDS || '7200' }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_AUTHORITY: ${{ secrets.MICROSOFT_AUTHORITY }}
          MICROSOFT_REDIRECT_URI: ${{ secrets.MICROSOFT_REDIRECT_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS || secrets.CORS_ORIGINS || secrets.FRONTEND_URL }}
          ADMIN_PORTAL_API_URL: ${{ secrets.ADMIN_PORTAL_API_URL || 'http://host.docker.internal:8001' }}
          MA_PORTAL_API_URL: ${{ secrets.MA_PORTAL_API_URL || 'http://host.docker.internal:8000' }}
          CEO_DATA_API_URL: ${{ secrets.CEO_DATA_API_URL || 'http://host.docker.internal:8005' }}
          FINANCE_PORTAL_API_URL: ${{ secrets.FINANCE_PORTAL_API_URL || 'http://host.docker.internal:8002' }}
          INTEGRATION_TIMEOUT_SECONDS: ${{ secrets.INTEGRATION_TIMEOUT_SECONDS || '5.0' }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}
          AWS_S3_REGION: ${{ secrets.AWS_S3_REGION || 'ca-central-1' }}
          AWS_ACCESS_KEY_ID: ${{ env.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.AWS_SECRET_ACCESS_KEY }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MQTT_HOST: ${{ secrets.MQTT_HOST || 'mqtt' }}
          MQTT_PORT: ${{ secrets.MQTT_PORT || '1883' }}
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_USE_TLS: ${{ secrets.MQTT_USE_TLS || 'false' }}
          MQTT_KEEPALIVE_SECONDS: ${{ secrets.MQTT_KEEPALIVE_SECONDS || '15' }}
          SERVICE_NAME: ${{ secrets.SERVICE_NAME || 'ceo-api' }}
          SERVICE_INSTANCE_ID: ${{ secrets.SERVICE_INSTANCE_ID || 'ceo-api-01' }}
          RABBITMQ_HOST: ${{ secrets.RABBITMQ_HOST || 'rabbitmq' }}
          RABBITMQ_PORT: ${{ secrets.RABBITMQ_PORT || '5672' }}
          RABBITMQ_DEFAULT_USER: ${{ secrets.RABBITMQ_DEFAULT_USER || secrets.RABBITMQ_USER }}
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_DEFAULT_PASS || secrets.RABBITMQ_PASSWORD }}
          RABBITMQ_URL: ${{ secrets.RABBITMQ_URL || 'amqp://guest:guest@host.docker.internal:5672/' }}
          COMMANDS_EXCHANGE: ${{ secrets.COMMANDS_EXCHANGE || 'ceo.commands' }}
          EVENTS_EXCHANGE: ${{ secrets.EVENTS_EXCHANGE || 'service.events' }}
          DLX_EXCHANGE: ${{ secrets.DLX_EXCHANGE || 'ceo.commands.dlx' }}
          TESSERACT_CMD: ${{ secrets.TESSERACT_CMD || '/usr/bin/tesseract' }}
          UPLOAD_S3_PREFIX: ${{ secrets.UPLOAD_S3_PREFIX || 'data' }}
          PORT: ${{ secrets.PORT }}
          MCP_PORT: ${{ secrets.MCP_PORT }}
        run: |
          install -m 600 /dev/null ec2-key.pem
          printf '%s\n' "$EC2_SSH_KEY" > ec2-key.pem

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "
            if [ ! -d ~/internal_portal_ceo_dashboard_backend/.git ]; then
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN || secrets.PAT_TOKEN || github.token }}@github.com/${{ github.repository }}.git ~/internal_portal_ceo_dashboard_backend
            else
              cd ~/internal_portal_ceo_dashboard_backend && \
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN || secrets.PAT_TOKEN || github.token }}@github.com/${{ github.repository }}.git && \
              git fetch origin main && \
              git reset --hard origin/main
            fi
          "

          {
            echo "APP_ENV=production"
            echo "LOG_LEVEL=INFO"
            echo "HOST=0.0.0.0"
            echo "PORT=8000"
            echo "MCP_HOST=0.0.0.0"
            echo "MCP_PORT=7001"
            echo "SLOW_REQUEST_MS=2000"
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'DATABASE_SSL=%s\n' "$DATABASE_SSL"
            if [ -n "$ADMIN_DATABASE_URL" ]; then
              printf 'ADMIN_DATABASE_URL=%s\n' "$ADMIN_DATABASE_URL"
            fi
            printf 'DB_MIN_CONNECTIONS=%s\n' "$DB_MIN_CONNECTIONS"
            printf 'DB_MAX_CONNECTIONS=%s\n' "$DB_MAX_CONNECTIONS"
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY"
            if [ -n "$GEMINI_ACCOUNT_REVIEW_MODELS" ]; then
              printf 'GEMINI_ACCOUNT_REVIEW_MODELS=%s\n' "$GEMINI_ACCOUNT_REVIEW_MODELS"
            else
              echo "GEMINI_ACCOUNT_REVIEW_MODELS=Gemini 2.5 Flash,Gemini 3.5 Flash,Gemini 2.5 Flash Lite,Gemini 3.1 Flash Lite,Deep Research Pro Preview,Gemini 2 Flash,Gemini 2 Flash Lite,Computer Use Preview,Nano Banana (Gemini 2.5 Flash Preview Image),Gemini 2.5 Flash TTS,Gemini 2.5 Pro,Gemini 2.5 Pro TTS,Gemini 3 Flash,Nano Banana Pro (Gemini 3 Pro Image),Gemini 3.1 Pro,Nano Banana 2 (Gemini 3.1 Flash Image),Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image),Gemini 3.1 Flash TTS,Gemini Embedding 1,Gemini Embedding 2,Gemini Omni Flash,Gemini Robotics ER 1.5 Preview,Gemini Robotics ER 1.6 Preview,Gemma 4 26B,Gemma 4 31B,Imagen 4 Fast Generate,Imagen 4 Generate,Imagen 4 Ultra Generate,Lyria 3 Clip,Lyria 3 Pro,Veo 3 Fast Generate,Veo 3 Generate,Veo 3 Lite Generate,Gemini 2.5 Flash Native Audio Dialog,Gemini 3 Flash Live,Gemini 3.5 Live Translate"
            fi
            if [ -n "$GEMINI_AVAILABLE_MODELS" ]; then
              printf 'GEMINI_AVAILABLE_MODELS=%s\n' "$GEMINI_AVAILABLE_MODELS"
            else
              echo "GEMINI_AVAILABLE_MODELS=Gemini 2.5 Flash,Gemini 3.5 Flash,Gemini 2.5 Flash Lite,Gemini 3.1 Flash Lite,Antigravity,Deep Research Pro Preview,Gemini 2 Flash,Gemini 2 Flash Lite,Computer Use Preview,Nano Banana (Gemini 2.5 Flash Preview Image),Gemini 2.5 Flash TTS,Gemini 2.5 Pro,Gemini 2.5 Pro TTS,Gemini 3 Flash,Nano Banana Pro (Gemini 3 Pro Image),Gemini 3.1 Pro,Nano Banana 2 (Gemini 3.1 Flash Image),Nano Banana 2 Lite (Gemini 3.1 Flash Lite Image),Gemini 3.1 Flash TTS,Gemini Embedding 1,Gemini Embedding 2,Gemini Omni Flash,Gemini Robotics ER 1.5 Preview,Gemini Robotics ER 1.6 Preview,Gemma 4 26B,Gemma 4 31B,Imagen 4 Fast Generate,Imagen 4 Generate,Imagen 4 Ultra Generate,Lyria 3 Clip,Lyria 3 Pro,Veo 3 Fast Generate,Veo 3 Generate,Veo 3 Lite Generate,Gemini 2.5 Flash Native Audio Dialog,Gemini 3 Flash Live,Gemini 3.5 Live Translate"
            fi
            if [ -n "$GEMINI_AVAILABLE_TOOL_QUOTA_MODELS" ]; then
              printf 'GEMINI_AVAILABLE_TOOL_QUOTA_MODELS=%s\n' "$GEMINI_AVAILABLE_TOOL_QUOTA_MODELS"
            else
              echo "GEMINI_AVAILABLE_TOOL_QUOTA_MODELS=Deep Research Pro Preview,Gemini 2 Flash,Computer Use Preview,Gemini 2.5 Flash,Gemini 2.5 Flash Lite,Gemini 2.5 Pro,Gemini 3 Flash,Gemini 3.1 Pro,Gemini 3.1 Flash Lite,Gemini 3.1 Flash TTS,Gemini 3.5 Flash,Gemini Robotics ER 1.6 Preview,Gemini 2,Gemini 2.5,Gemini 3,Default"
            fi
            printf 'SESSION_SECRET=%s\n' "$SESSION_SECRET"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'JWT_ALGORITHM=%s\n' "$JWT_ALGORITHM"
            printf 'JWT_ISSUER=%s\n' "$JWT_ISSUER"
            printf 'AUTH_TOKEN_TTL_SECONDS=%s\n' "$AUTH_TOKEN_TTL_SECONDS"
            printf 'MICROSOFT_CLIENT_ID=%s\n' "$MICROSOFT_CLIENT_ID"
            printf 'MICROSOFT_CLIENT_SECRET=%s\n' "$MICROSOFT_CLIENT_SECRET"
            printf 'MICROSOFT_TENANT_ID=%s\n' "$MICROSOFT_TENANT_ID"
            if [ -n "$MICROSOFT_AUTHORITY" ]; then
              printf 'MICROSOFT_AUTHORITY=%s\n' "$MICROSOFT_AUTHORITY"
            elif [ -n "$MICROSOFT_TENANT_ID" ]; then
              printf 'MICROSOFT_AUTHORITY=https://login.microsoftonline.com/%s\n' "$MICROSOFT_TENANT_ID"
            fi
            if [ -n "$MICROSOFT_REDIRECT_URI" ]; then
              printf 'MICROSOFT_REDIRECT_URI=%s\n' "$MICROSOFT_REDIRECT_URI"
            fi
            printf 'FRONTEND_URL=%s\n' "$FRONTEND_URL"
            printf 'CORS_ALLOWED_ORIGINS=%s\n' "$CORS_ALLOWED_ORIGINS"
            printf 'ADMIN_PORTAL_API_URL=%s\n' "$ADMIN_PORTAL_API_URL"
            printf 'MA_PORTAL_API_URL=%s\n' "$MA_PORTAL_API_URL"
            printf 'CEO_DATA_API_URL=%s\n' "$CEO_DATA_API_URL"
            printf 'FINANCE_PORTAL_API_URL=%s\n' "$FINANCE_PORTAL_API_URL"
            printf 'INTEGRATION_TIMEOUT_SECONDS=%s\n' "$INTEGRATION_TIMEOUT_SECONDS"
            printf 'AWS_S3_BUCKET_NAME=%s\n' "$AWS_S3_BUCKET_NAME"
            printf 'AWS_S3_REGION=%s\n' "$AWS_S3_REGION"
            if [ -n "$AWS_ACCESS_KEY_ID" ]; then
              printf 'AWS_ACCESS_KEY_ID=%s\n' "$AWS_ACCESS_KEY_ID"
            fi
            if [ -n "$AWS_SECRET_ACCESS_KEY" ]; then
              printf 'AWS_SECRET_ACCESS_KEY=%s\n' "$AWS_SECRET_ACCESS_KEY"
            fi
            if [ -n "$MONGODB_URI" ]; then
              printf 'MONGODB_URI=%s\n' "$MONGODB_URI"
            fi
            printf 'MQTT_HOST=%s\n' "$MQTT_HOST"
            printf 'MQTT_PORT=%s\n' "$MQTT_PORT"
            if [ -n "$MQTT_USERNAME" ]; then
              printf 'MQTT_USERNAME=%s\n' "$MQTT_USERNAME"
            fi
            if [ -n "$MQTT_PASSWORD" ]; then
              printf 'MQTT_PASSWORD=%s\n' "$MQTT_PASSWORD"
            fi
            printf 'MQTT_USE_TLS=%s\n' "$MQTT_USE_TLS"
            printf 'MQTT_KEEPALIVE_SECONDS=%s\n' "$MQTT_KEEPALIVE_SECONDS"
            printf 'SERVICE_NAME=%s\n' "$SERVICE_NAME"
            printf 'SERVICE_INSTANCE_ID=%s\n' "$SERVICE_INSTANCE_ID"
            if [ -n "$RABBITMQ_HOST" ]; then
              printf 'RABBITMQ_HOST=%s\n' "$RABBITMQ_HOST"
            fi
            if [ -n "$RABBITMQ_PORT" ]; then
              printf 'RABBITMQ_PORT=%s\n' "$RABBITMQ_PORT"
            fi
            if [ -n "$RABBITMQ_DEFAULT_USER" ]; then
              printf 'RABBITMQ_DEFAULT_USER=%s\n' "$RABBITMQ_DEFAULT_USER"
            fi
            if [ -n "$RABBITMQ_DEFAULT_PASS" ]; then
              printf 'RABBITMQ_DEFAULT_PASS=%s\n' "$RABBITMQ_DEFAULT_PASS"
            fi
            printf 'RABBITMQ_URL=%s\n' "$RABBITMQ_URL"
            printf 'COMMANDS_EXCHANGE=%s\n' "$COMMANDS_EXCHANGE"
            printf 'EVENTS_EXCHANGE=%s\n' "$EVENTS_EXCHANGE"
            printf 'DLX_EXCHANGE=%s\n' "$DLX_EXCHANGE"
            printf 'TESSERACT_CMD=%s\n' "$TESSERACT_CMD"
            printf 'UPLOAD_S3_PREFIX=%s\n' "$UPLOAD_S3_PREFIX"
            echo "DATA_PATH=/app/data"
            echo "UPLOAD_FILES_DIR=/app/data/upload_files"
            echo "AUTH_COOKIE_SECURE=true"
            echo "SESSION_COOKIE_SECURE=true"
          } > .env.production

          scp -o StrictHostKeyChecking=no -i ec2-key.pem .env.production "$EC2_USER@$EC2_HOST":~/internal_portal_ceo_dashboard_backend/.env.production

          ssh -o StrictHostKeyChecking=no -i ec2-key.pem "$EC2_USER@$EC2_HOST" "
            cd ~/internal_portal_ceo_dashboard_backend
            mkdir -p data data/upload_files
            sudo chown -R 10001:10001 data 2>/dev/null || sudo chmod -R 777 data

            # Ensure EC2 IMDSv2 hop limit is 2 so Docker container can access IAM role
            TOKEN=\$(curl -s -X PUT 'http://169.254.169.254/latest/api/token' -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' 2>/dev/null || true)
            if [ -n \"\$TOKEN\" ]; then
              INSTANCE_ID=\$(curl -s -H \"X-aws-ec2-metadata-token: \$TOKEN\" http://169.254.169.254/latest/meta-data/instance-id 2>/dev/null || true)
              if [ -n \"\$INSTANCE_ID\" ]; then
                aws ec2 modify-instance-metadata-options --instance-id \"\$INSTANCE_ID\" --http-put-response-hop-limit 2 --http-endpoint enabled 2>/dev/null || true
              fi
            fi

            sudo docker build -t ceo-backend-api:latest .
            if docker compose version &>/dev/null; then
              sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans
            elif command -v docker-compose &>/dev/null; then
              sudo docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            else
              sudo curl -L \"https://github.com/docker/compose/releases/latest/download/docker-compose-\$(uname -s)-\$(uname -m)\" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo /usr/local/bin/docker-compose -f docker-compose.prod.yml up -d --remove-orphans
            fi
          "
          rm -f ec2-key.pem .env.production

      - name: Revoke Security Group SSH
        if: always() && env.AWS_ACCESS_KEY != '' && env.AWS_SECURITY_GROUP_ID != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ env.AWS_SECURITY_GROUP_ID }} \
            --protocol tcp --port 22 --cidr ${{ steps.ip.outputs.ipv4 }}/32 || true
