name: File size check

on:
  pull_request:
  push:

jobs:
  file-sizes:
    name: Source files stay under the line limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check file sizes (limit and baseline in .agents/file_size_baseline.json)
        run: node .agents/check_file_sizes.mjs
