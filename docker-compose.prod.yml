services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: ceo-backend-api:latest
    container_name: ceo_backend_api_prod

    ports:
      - "8005:8005"
      - "8006:8006"

    volumes:
      - ./data:/app/data

    env_file:
      - path: .env.production
        required: true

    environment:
      - APP_ENV=production
      - PORT=8005
      - MCP_PORT=8006

    extra_hosts:
      - "host.docker.internal:host-gateway"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/live')"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
