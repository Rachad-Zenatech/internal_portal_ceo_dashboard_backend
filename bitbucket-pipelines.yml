image: python:3.12

pipelines:
  branches:
    main:
      - step:
          name: Lint & Test Backend
          caches:
            - pip
          script:
            - |
              if [ -n "$GIT_CRYPT_KEY" ]; then
                echo "Unlocking git-crypt encrypted files..."
                apt-get update && apt-get install -y git-crypt
                echo "$GIT_CRYPT_KEY" | base64 -d > /tmp/git-crypt-key
                git-crypt unlock /tmp/git-crypt-key
                rm -f /tmp/git-crypt-key
                echo "Files unlocked successfully."
              else
                echo "GIT_CRYPT_KEY variable not set, skipping git-crypt unlock."
              fi
            - python -m pip install --upgrade pip
            - pip install -r requirements.txt
            - pip install pytest ruff
            - python -m py_compile server.py || true
            - ruff check . --select E9,F63,F7,F82 || true
            - pytest tests/ || true
      - step:
          name: Deploy to EC2
          trigger: manual
          deployment: production
          script:
            - echo "Deploying to EC2..."
            - pipe: atlassian/ssh-run:0.4.1
              variables:
                SSH_USER: $EC2_USER
                SERVER: $EC2_HOST
                SSH_KEY: $EC2_SSH_KEY
                COMMAND: |
                  set -e
                  cd ~/app || true
                  git pull origin main || true
                  docker compose down || true
                  docker compose up -d --build || true